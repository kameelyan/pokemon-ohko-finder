<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Red top half -->
  <path d="M 3 50 A 47 47 0 0 1 97 50 Z" fill="#e53e3e"/>
  <!-- White bottom half -->
  <path d="M 3 50 A 47 47 0 0 0 97 50 Z" fill="#ffffff"/>
  <!-- Outer black border -->
  <circle cx="50" cy="50" r="47" fill="none" stroke="#1a1a1a" stroke-width="6"/>
  <!-- Center band -->
  <line x1="3" y1="50" x2="97" y2="50" stroke="#1a1a1a" stroke-width="6"/>
  <!-- Center button outer ring -->
  <circle cx="50" cy="50" r="13" fill="#1a1a1a"/>
  <!-- Center button inner white -->
  <circle cx="50" cy="50" r="8" fill="#ffffff"/>
</svg>
